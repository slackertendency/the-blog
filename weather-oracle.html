<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Oracle 3000</title>

<style>

body{
    background:black;
    color:white;
    margin:0;
    font-family:Arial, sans-serif;
}

.wrapper{
    width:100%;
    max-width:1600px;
    margin:auto;
}

.banner-container{
    position:relative;
    width:100%;
}

.banner{
    width:100%;
    display:block;
}

.sphere{
    position:absolute;
    mix-blend-mode: screen;
    filter: brightness(1.2) contrast(1.2);

    width: 100%;


    right: -26%;
    top: -34%;

   
}
    
   


.controls{
    width:300px;
    margin:40px auto;
    text-align:center;
}

input[type=range]{
    width:100%;
}

.day{
    margin-top:10px;
    font-size:18px;
    letter-spacing:2px;
}

.description{
    max-width:700px;
    margin:50px auto;
    text-align:center;
    line-height:1.7;
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="banner-container">

        <img
            src="ORACLE.png"
            class="banner"
        >

        <img
            id="sphere"
            src="daily_weather/sphere_01.png"
            class="sphere"
        >

    </div>

    <!-- ========================= -->
<!-- WEATHER ORACLE KNOB UI -->
<!-- ========================= -->

<style>
.oracle-controls{
    position:absolute;
    left:170px;
    top:240px;
    z-index:20;

    display:flex;
    flex-direction:column;
    align-items:center;
    gap:12px;
}

.knob-wrapper{
    width:90px;
    height:90px;
    position:relative;
}

#dayKnob{
    position:absolute;
    inset:0;
    opacity:0;
    cursor:pointer;
}

.knob-wrapper::before{
    content:'';
    position:absolute;
    inset:0;

    border:2px solid white;
    border-radius:50%;

    background:
    radial-gradient(
        circle at center,
        #444 0%,
        #222 55%,
        #111 100%
    );
}

.knob-wrapper::after{
    content:'';

    position:absolute;

    width:4px;
    height:28px;

    background:white;

    left:50%;
    top:10px;

    transform:
        translateX(-50%)
        rotate(var(--rotation,-135deg));

    transform-origin:center 35px;

    transition:transform .15s ease;

    pointer-events:none;
}

#dateLabel{
    color:white;
    font-family:monospace;
    font-size:20px;
    letter-spacing:2px;
}
</style>


<div class="oracle-controls">

    <div class="knob-wrapper">
        <input
            type="range"
            id="dayKnob"
            min="0"
            max="13"
            step="1"
            value="0"
        >
    </div>

    <div id="dateLabel">27-08-25</div>

</div>


<script>
const knob = document.getElementById("dayKnob");
const label = document.getElementById("dateLabel");
const sphere = document.getElementById("weatherSphere");

const dates = [
    "27-08-25",
    "28-08-25",
    "29-08-25",
    "30-08-25",
    "31-08-25",
    "01-09-25",
    "02-09-25",
    "03-09-25",
    "04-09-25",
    "05-09-25",
    "06-09-25",
    "07-09-25",
    "08-09-25",
    "09-09-25"
];

function updateWeather(){

    const day = Number(knob.value);

    label.textContent = dates[day];

    document
        .querySelector('.knob-wrapper')
        .style.setProperty(
            '--rotation',
            `${-135 + (day / 13) * 270}deg`
        );

    sphere.src =
        `daily_weather/sphere_${String(day + 1).padStart(2,'0')}.png`;
}

knob.addEventListener("input", updateWeather);

updateWeather();
</script>

        <div id="dayLabel" class="day">
            Day 1
        </div>

    </div>

    <div class="description">

        Weather Oracle 3000 is a speculative forecasting artifact.
        Each sphere represents a generated weather future.

    </div>

</div>

<script>

const slider = document.getElementById("slider");
const sphere = document.getElementById("sphere");
const label = document.getElementById("dayLabel");

slider.addEventListener("input", () => {

    let day = String(slider.value).padStart(2,"0");

    sphere.src =
        `daily_weather/sphere_${day}.png`;

    label.innerText =
        `Day ${slider.value}`;

});

</script>

</body>
</html>
