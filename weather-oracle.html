<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Weather Oracle 3000</title>

<style>

body{
    background:black;
    color:white;
    margin:0;
    font-family:Arial, sans-serif;
}

.wrapper{
    width:100%;
    max-width:1600px;
    margin:auto;
}

.banner-container{
    position:relative;
    width:100%;
}

.banner{
    width:100%;
    display:block;
}


    
   


.controls{
    width:300px;
    margin:40px auto;
    text-align:center;
}

input[type=range]{
    width:100%;
}

.day{
    margin-top:10px;
    font-size:18px;
    letter-spacing:2px;
}

.description{
    max-width:700px;
    margin:50px auto;
    text-align:center;
    line-height:1.7;
}

</style>
</head>

<body>

<div class="wrapper">

    <div class="banner-container">

        <img
            src="ORACLE.png"
            class="banner"
        >

        

    </div>
<!-- ========================= -->
<!-- WEATHER ORACLE DATE GRID -->
<!-- ========================= -->

<style>
.date-grid{
    position:absolute;
    left:80px;
    top:250px;

    display:grid;
    grid-template-columns:repeat(4, auto);
    gap:10px;

    z-index:20;
}

.date-btn{
    background:black;
    border:1px solid white;

    color:white;

    padding:8px 12px;

    font-family:monospace;
    font-size:14px;

    cursor:pointer;

    transition:all .15s ease;
}

.date-btn:hover{
    background:white;
    color:black;
}

.date-btn.active{
    background:white;
    color:black;
}

/* sphere */
#weatherSphere{
    position:absolute;

    right:-15%;
    top:-20%;

    width:80%;
    height:auto;

    z-index:10;

    mix-blend-mode:screen;
}
</style>


<!-- SPHERE -->
<img
    id="weatherSphere"
    src="daily_weather/sphere_01.png"
    alt="Weather Sphere"
>


<!-- DATE SELECTOR -->
<div class="date-grid" id="dateGrid"></div>


<script>
const sphere = document.getElementById("weatherSphere");
const dateGrid = document.getElementById("dateGrid");

const dates = [
    "27-08-25",
    "28-08-25",
    "29-08-25",
    "30-08-25",
    "31-08-25",
    "01-09-25",
    "02-09-25",
    "03-09-25",
    "04-09-25",
    "05-09-25",
    "06-09-25",
    "07-09-25",
    "08-09-25",
    "09-09-25"
];

dates.forEach((date,index)=>{

    const btn = document.createElement("button");

    btn.className = "date-btn";

    if(index === 0){
        btn.classList.add("active");
    }

    btn.textContent = date;

    btn.addEventListener("click",()=>{

        document
            .querySelectorAll(".date-btn")
            .forEach(b=>b.classList.remove("active"));

        btn.classList.add("active");

        sphere.src =
            `daily_weather/sphere_${String(index+1).padStart(2,'0')}.png`;
    });

    dateGrid.appendChild(btn);

});
</script>
 







    <div class="description">

        Weather Oracle 3000 is a speculative forecasting artifact.
        Each sphere represents a generated weather future.

    </div>

</div>

<script>

const slider = document.getElementById("slider");
const sphere = document.getElementById("sphere");
const label = document.getElementById("dayLabel");

slider.addEventListener("input", () => {

    let day = String(slider.value).padStart(2,"0");

    sphere.src =
        `daily_weather/sphere_${day}.png`;

    label.innerText =
        `Day ${slider.value}`;

});

</script>

</body>
</html>
